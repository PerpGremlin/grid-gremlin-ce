# The suite runs on every pull request and every push to main, so a red
# suite shows on the pull request before anyone reads it. Standard library
# only: Python is the whole setup.
name: specs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/run.py
